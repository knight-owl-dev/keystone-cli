name: "Setup .NET"
description: "Installs .NET SDK from global.json for centralized version management."

inputs:
  dotnet-version:
    description: "Optional override (e.g. 10.0.x). If omitted, global.json is used."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup .NET SDK (from global.json)
      if: inputs.dotnet-version == ''
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: global.json

    - name: Setup .NET SDK (from input override)
      if: inputs.dotnet-version != ''
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
