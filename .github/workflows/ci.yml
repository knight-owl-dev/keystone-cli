name: CI

# No push run: main's ruleset admits only up-to-date, green PRs, so it would
# re-test the same tree.
on:
  workflow_dispatch:  # Manual trigger runs all jobs
  pull_request:

permissions:
  contents: read

jobs:
  lint-dotnet:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dotnet
      - name: Lint
        run: make lint-dotnet

  lint:
    runs-on: ubuntu-26.04-arm
    container: ghcr.io/knight-owl-dev/ci-tools:v1.7.0@sha256:874c21b95c53948677c55b558b4b128b38111d4ce567789cafc6344953b631cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint
        run: make lint SKIP="lint-dotnet"

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-dotnet

      - name: Test
        run: dotnet test ./tests/Keystone.Cli.UnitTests/Keystone.Cli.UnitTests.csproj -c Release

  changes:
    runs-on: ubuntu-26.04-arm
    permissions:
      pull-requests: read
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            packaging:
              - 'src/**/*.csproj'
              - 'Directory.Build.props'
              - 'nfpm.yaml'
              - 'scripts/package-deb.sh'
              - 'scripts/verify-deb-install.sh'
              - 'tests/deb/**'

  build-deb:
    name: Build .deb (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.packaging == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
            rid: linux-x64
          - runner: ubuntu-26.04-arm
            arch: arm64
            rid: linux-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-dotnet

      - name: Publish
        env:
          RID: ${{ matrix.rid }}
        run: dotnet publish ./src/Keystone.Cli/Keystone.Cli.csproj -c Release -r "${RID}"

      - name: Build .deb package
        uses: ./.github/actions/build-deb
        with:
          rid: ${{ matrix.rid }}

      - name: Upload .deb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.rid }}
          path: artifacts/release/keystone-cli_*.deb
          if-no-files-found: error

  test-deb:
    name: Test .deb (${{ matrix.distro }}-${{ matrix.arch }})
    needs: [changes, build-deb]
    if: needs.changes.outputs.packaging == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
            rid: linux-x64
            distro: debian-trixie
            image: debian:trixie
          - runner: ubuntu-26.04
            arch: amd64
            rid: linux-x64
            distro: ubuntu-26.04
            image: ubuntu:26.04
          - runner: ubuntu-26.04-arm
            arch: arm64
            rid: linux-arm64
            distro: debian-trixie
            image: debian:trixie
          - runner: ubuntu-26.04-arm
            arch: arm64
            rid: linux-arm64
            distro: ubuntu-26.04
            image: ubuntu:26.04

    steps:
      - name: Checkout (for verify script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Download .deb artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-${{ matrix.rid }}
          path: deb

      - name: Verify installation
        # SAFE_ARCH is the validated architecture; * is left unquoted for globbing and "$SAFE_ARCH" is quoted after the glob.
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SAFE_ARCH="$(./scripts/validate-arch.sh "${ARCH}")"
          ./scripts/verify-deb-install.sh ./deb/keystone-cli_*_"${SAFE_ARCH}".deb
